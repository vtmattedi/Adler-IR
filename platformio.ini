; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; [env:esp32]
; platform = espressif32
; board = esp32doit-devkit-v1
; framework = arduino
; ; keep the standalone NanoC6 bring-up test out of the main firmware build
; build_src_filter = +<*> -<test_m5nanoc6.cpp>
; lib_deps =
; 	milesburton/DallasTemperature@^3.9.1
; 	bblanchon/ArduinoJson@^6.21.3
; 	https://github.com/vtmattedi/NightMareNetwork.git
; build_type = debug
; monitor_speed = 115200
; monitor_filters = send_on_enter, esp32_exception_decoder
; extra_scripts =
; 	pre:src/Version/script.py
; 	pre:src/Version/Nightmare.py
; monitor_dtr = 0
; monitor_rts = 0

; ---------------------------------------------------------------------
; The deployed Adler unit: ESP32-C3 SuperMini.
;   pio run -e esp32c3-supermini -t upload -t monitor
; The pin map lives in include/board.h, nothing board specific here.
; ---------------------------------------------------------------------
[env:esp32c3-supermini]
; pioarduino fork, pinned. The registry's "espressif32" stops at Arduino core
; 2.x; NightMareNetwork and IRremote are built against core 3.x here.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = nologo_esp32c3_super_mini
framework = arduino
; default.csv caps the app at 1.25 MB; bump to 1.9 MB app slots (OTA kept, SPIFFS shrunk)
board_build.partitions = min_spiffs.csv
build_flags =
	; lib/ and .pio/libdeps/ are compiled with their own include paths, so the
	; project include dir has to be named explicitly for board.h to resolve there.
	-I "${platformio.include_dir}"
	; NightMareNetwork's own switch, not an Arduino one: it points the serial
	; command resolver at HWCDC instead of HardwareSerial (see NightMareCommand.h).
	; The C3 console is native USB, so HardwareSerial would not match Serial.
	-D ESP32_C3
	; Picks the wiring revision out of include/board.h. Exactly one is required
	; and the build fails otherwise. Unrelated to ESP32_C3 above.
	-D BOARD_C3_V1
; ARDUINO_USB_MODE=1 and ARDUINO_USB_CDC_ON_BOOT=1 come from the board definition,
; and the C3 enumerates as USB directly -- there is no bridge to hold out of reset
; with monitor_rts/monitor_dtr the way the classic ESP32 needs.
monitor_speed = 115200
monitor_filters = send_on_enter, esp32_exception_decoder
extra_scripts =
	pre:src/Version/script.py
	pre:src/Version/Nightmare.py
lib_deps =
	https://github.com/vtmattedi/NightMareNetwork.git
	bblanchon/ArduinoJson@^6.21.3
	; DallasTemperature pulls OneWire in on its own; OneWire is pinned because
	; releases before 2.3.8 do not build for the C3's RISC-V core.
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0