; PlatformIO Project Configuration File
;
; Shared settings live in [env]. Each hardware environment selects only its
; platform, PlatformIO board, and Adler wiring revision through build_flags.

[env]
framework = arduino
; default.csv caps the app at 1.25 MB; use 1.9 MB app slots while retaining OTA.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = send_on_enter, esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0
extra_scripts =
	pre:src/Version/script.py
lib_deps =
	https://github.com/vtmattedi/NightMareNetwork.git#a03739e
	bblanchon/ArduinoJson@^6.21.3
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0

; Deployed Adler: ESP32-C3 SuperMini.
[env:esp32c3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = nologo_esp32c3_super_mini
build_flags =
	-I "${platformio.include_dir}"
	; NightMareNetwork uses this switch to select the native-USB HWCDC console.
	-D ESP32_C3
	-D BOARD_C3_V1

; Original Adler: classic ESP32 DevKit v1.
[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
build_flags =
	-I "${platformio.include_dir}"
	-D BOARD_ESP32_V1

; M5Stack NanoC6: onboard IR TX, RGB LED, button and blue status LED.
[env:m5stack-nanoc6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitm-1
lib_deps =
	https://github.com/vtmattedi/NightMareNetwork.git#a03739e
	bblanchon/ArduinoJson@^6.21.3
	adafruit/Adafruit NeoPixel @ ^1.12.3
build_flags =
	-I "${platformio.include_dir}"
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	; NightMareNetwork uses this switch for its HWCDC console type.
	-D ESP32_C6
	-D BOARD_C6_V1
