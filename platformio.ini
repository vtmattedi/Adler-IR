; ---------------------------------------------------------------------
; Brand-new M5Stack NanoC6 (ESP32-C6) bring-up / smoke test.
;   pio run -e m5stack-nanoc6 -t upload -t monitor
; Self-contained: compiles ONLY src/test_m5nanoc6.cpp, no firmware deps.
; ESP32-C6 needs Arduino core 3.x -> pioarduino platform fork.
; There is no m5stack-nanoc6 board def, so we target the electrically
; equivalent generic ESP32-C6 dev board (RISC-V, 4 MB flash).
; ---------------------------------------------------------------------
[env:m5stack-nanoc6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
; M5NanoC6 has 4 MB flash (devkitc-1 def assumes 8 MB)
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
; default.csv caps the app at 1.25 MB; bump to 1.9 MB app slots (OTA kept, SPIFFS shrunk)
board_build.partitions = min_spiffs.csv
; route Serial to the C6 native USB-Serial-JTAG (the NanoC6 USB-C port)
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
monitor_speed = 115200
monitor_filters = send_on_enter, esp32_exception_decoder
extra_scripts =
	pre:src/Version/script.py
	pre:src/Version/Nightmare.py
lib_deps =
	milesburton/DallasTemperature@^3.9.1
	bblanchon/ArduinoJson@^6.21.3
	https://github.com/vtmattedi/NightMareNetwork.git